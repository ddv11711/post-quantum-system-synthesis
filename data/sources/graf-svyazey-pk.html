<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Общий граф четырёх ПК</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f7fb;--surface:#fff;--text:#15283c;--muted:#42586e;--line:#d2deeb;--blue:#2166ab;--blue-bg:#eaf4ff;--violet:#7649a6;--violet-bg:#f1eafd;--green:#107265;--green-bg:#e8f6f1;--plain:#7b90a8;--white:#fff;--dot:#e1e9f4;font:15px/1.45 "Segoe UI",Arial,sans-serif}
  @media(prefers-color-scheme:dark){:root{--bg:#121a25;--surface:#192534;--text:#e8f2fd;--muted:#afc4da;--line:#354c65;--blue:#8bbdff;--blue-bg:#233b57;--violet:#c9a4f5;--violet-bg:#382f53;--green:#83d6c7;--green-bg:#183d39;--plain:#7893b0;--white:#162233;--dot:#2a3b4e}}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;color:var(--text);background:var(--bg)}
  main{width:min(1420px,100%);margin:auto;padding:23px 28px}
  h1{font-size:clamp(25px,3vw,34px);line-height:1.15;letter-spacing:-.02em;margin:0 0 17px}
  .toolbar{display:flex;align-items:end;gap:10px 22px;flex-wrap:wrap}
  label,.field{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:5px}
  button,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:39px;padding:6px 11px}
  button{cursor:pointer} button:hover{color:var(--blue);background:var(--blue-bg)} button:disabled{opacity:.45;cursor:default}
  :is(button,select,[tabindex]):focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  .tabs{display:flex;flex-wrap:wrap;gap:4px}
  .tabs [aria-pressed=true]{background:var(--blue);color:var(--white);border-color:var(--blue)}
  select{width:min(340px,calc(100vw - 32px));max-width:100%}
  .meta{min-height:22px;margin:12px 0 6px;color:var(--muted);font-size:13px}
  .surface{position:relative;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
  #canvas{height:clamp(400px,calc(100dvh - 218px),975px);cursor:grab;touch-action:none;overflow:hidden;background:radial-gradient(circle,var(--dot) 1px,transparent 1.3px) 0 0/18px 18px}
  #canvas.dragging,#canvas.dragging .unit{cursor:grabbing}
  #canvas svg{display:block;width:100%;height:100%}
  .zoom{position:absolute;top:10px;right:10px;z-index:1;display:flex;align-items:center;gap:3px;background:var(--surface);padding:3px;border:1px solid var(--line);border-radius:9px}
  .zoom button{padding:2px 8px;min-height:31px;border-color:transparent}
  .zoom output{width:43px;text-align:center;color:var(--muted);font-size:13px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 22px;padding:9px 0 0;font-size:13px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:21px;height:0;border-top:2px solid var(--blue)}
  .legend .user i{border-color:var(--violet);border-top-style:dashed}
  .legend .admin i{border-color:var(--green);border-top-style:dotted}
  .edge{fill:none;stroke:var(--plain);stroke-width:1.5;opacity:.41}
  .edge.net{stroke:var(--blue);stroke-width:2.5;opacity:.72}
  .edge.user{stroke:var(--violet);stroke-dasharray:7 5;stroke-width:2;opacity:.32}
  .edge.admin{stroke:var(--green);stroke-dasharray:3 5;opacity:.29}
  .pc-edge-frame{fill:var(--blue-bg);fill-opacity:.55;stroke:var(--line);stroke-width:2}
  .frame-count{font:16px Arial,"Liberation Sans",sans-serif;fill:var(--muted);dominant-baseline:central}
  .unit{cursor:pointer}
  .unit rect{fill:var(--surface);stroke:var(--blue);stroke-width:1.5}
  .unit.nameplate rect{fill:var(--blue);stroke:var(--blue)}
  .unit.nameplate text{fill:var(--white);font-weight:700}
  .unit.user rect{fill:var(--violet-bg);stroke:var(--violet)}
  .unit.admin rect{fill:var(--green-bg);stroke:var(--green)}
  .unit text{font:16px Arial,"Liberation Sans",sans-serif;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .unit:focus rect,.unit.emph rect{stroke-width:3}
  svg.highlight .edge:not(.active){opacity:.085}
  svg.highlight .edge.active{opacity:.95;stroke-width:2.4}
  svg.highlight .unit:not(.emph):not(.related){opacity:.53}
  .detail{padding:16px clamp(11px,3vw,34px) 24px}
  .hub{text-align:center;margin:10px 0 18px}
  .hub h2{margin:0;font-size:clamp(20px,2.7vw,28px)}
  .lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 30px}
  .lanes h3{margin:0 0 8px;font-size:16px;color:var(--blue)}
  .lanes .to h3{color:var(--green)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
  li button{width:100%;text-align:left;overflow-wrap:anywhere}
  .access details{border-top:1px solid var(--line)}
  .access summary{cursor:pointer;font-weight:650;color:var(--green);padding:11px 0}
  .access ul{grid-template-columns:repeat(auto-fit,minmax(min(100%,218px),1fr));padding-bottom:14px}
  .empty{color:var(--muted)}
  @media(max-width:620px){main{padding:16px 12px}.tabs{gap:3px}.tabs button{padding-inline:7px}.lanes{gap:9px}.zoom{top:6px;right:6px}#canvas{height:clamp(350px,calc(100dvh - 252px),760px)}}
</style>
</head>
<body>
<main>
  <h1>Общий граф четырёх ПК</h1>
  <div class="toolbar">
    <div><span class="field" id="view-label">Граф</span><div class="tabs" id="tabs" role="group" aria-labelledby="view-label"></div></div>
    <div><label for="entity">Сущность</label><select id="entity"></select></div>
  </div>
  <p class="meta" id="status" role="status"></p>
  <section id="overview" aria-label="Граф связей">
    <div id="canvas" class="surface" tabindex="0" aria-label="Граф. Перетаскивание перемещает, колесо меняет масштаб">
      <svg id="figure" role="img" aria-label="Граф ПК и общих сущностей"></svg>
      <div class="zoom" role="group" aria-label="Масштаб">
        <button type="button" id="less" aria-label="Отдалить">−</button><output id="scale"></output>
        <button type="button" id="more" aria-label="Приблизить">+</button><button type="button" id="fit">Вписать</button>
      </div>
    </div>
    <div class="legend" id="legend"><span><i style="border-color:var(--plain)"></i>Связи внутри ПК</span><span><i></i>Сеть и общие ресурсы</span><span class="user"><i></i>Связи пользователей</span><span class="admin"><i></i>Доступ администратора</span></div>
  </section>
  <section class="surface detail" id="detail" aria-labelledby="detail-title" hidden>
    <button type="button" id="back">← К графу</button>
    <div class="hub"><h2 id="detail-title"></h2></div>
    <div class="lanes" id="lanes">
      <div><h3>← Входящие</h3><ul id="inputs"></ul></div>
      <div class="to"><h3>Исходящие →</h3><ul id="outputs"></ul></div>
    </div>
    <div class="access" id="access" hidden></div>
  </section>
  <noscript>Для отображения графа нужно включить JavaScript.</noscript>
</main>

"use strict";
const get = (id) => document.getElementById(id);

function svg(tag, attrs, parent, text) {
  const item = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [name, value] of Object.entries(attrs)) item.setAttribute(name, value);
  if (text !== undefined) item.textContent = text;
  parent.append(item);
  return item;
}
function makeBox(key, name, x, y, w, h, kind, lines = [name]) { return {key,name,x,y,w,h,kind,lines}; }
function border(box, x, y) {
  const dx = x-box.x, dy = y-box.y;
  const k = Math.min((box.w/2+2)/Math.abs(dx),(box.h/2+2)/Math.abs(dy));
  return [box.x+dx*k,box.y+dy*k];
}
function connect(left, right, parent, type) {
  const dx = right.x-left.x, dy = right.y-left.y;
  const len = Math.hypot(dx,dy);
  const bend = type === "user" ? Math.min(len*.13, 72) : type === "basic" ? Math.min(len*.09,26) : 0;
  const midX=(left.x+right.x)/2-dy/len*bend;
  const midY=(left.y+right.y)/2+dx/len*bend;
  const start=border(left,midX,midY), end=border(right,midX,midY);
  const attrs={d:"M"+start.join(" ")+"Q"+midX+" "+midY+" "+end.join(" "),class:"edge "+type,
    "marker-end":"url(#tip-"+type+")","data-from":left.key,"data-to":right.key};
  strokes.push([left.key,right.key,svg("path",attrs,parent)]);
}
function mark(box,parent) {
  const item=svg("g",{class:"unit "+box.kind,transform:"translate("+box.x+" "+box.y+")","data-key":box.key},parent);
  svg("title",{},item,nodes.has(box.key)?fullName(box.key):box.name);
  svg("rect",{x:-box.w/2,y:-box.h/2,width:box.w,height:box.h,rx:box.kind==="nameplate"?9:6},item);
  const title=svg("text",{},item);
  box.lines.forEach((line,i)=>svg("tspan",{x:0,y:(i-(box.lines.length-1)/2)*18},title,line));
  item.addEventListener("pointerenter",()=>{if(!drag?.moving) highlight(box.key);});
  item.addEventListener("pointerleave",()=>{if(!drag?.moving) highlight(null);});
  item.addEventListener("click",()=>{
    if(moved) return;
    if(box.key.startsWith("pc:")) changeView(box.name);
    else inspect(box.key);
    element.focus();
  });
  marks.push([box.key,item]);
}
function highlight(key) {
  figure.classList.toggle("highlight",key!==null);
  const neighbors = new Set();
  for(const [a,b,path] of strokes) {
    const active = a===key || b===key;
    path.classList.toggle("active",active);
    if(active) neighbors.add(a===key?b:a);
  }
  for(const [id,node] of marks) {
    node.classList.toggle("emph",id===key);
    node.classList.toggle("related",neighbors.has(id));
  }
}
function drawNetwork(frame, wires, labels) {

  ];
  for (const [key,x,y,w,h] of placements) {
    boxes.set(key, makeBox(key, nodes.get(key).name, x, y*world[1], w, h, key===admin?"admin":""));
  }
  for (const [a,b] of data.edges) {

  }
  scene=svg("g",{},figure);
  const frame=svg("g",{},scene), wires=svg("g",{},scene), labels=svg("g",{},scene);
  if(view==="all") drawNetwork(frame,wires,labels); else drawPc(wires,labels);
  get("legend").hidden=view!=="all";
  fit();
}
function applyCamera() {
  scene.setAttribute("transform","translate("+camera.x+" "+camera.y+") scale("+camera.scale+")");
  get("scale").textContent=Math.round(100*camera.scale/camera.fit)+"%";
}
function fit() {
  const w=figure.clientWidth,h=figure.clientHeight;
  if(!w||!h) return;
  figure.setAttribute("viewBox","0 0 "+w+" "+h);
  camera.fit=Math.min((w-20)/world[0],(h-20)/world[1],1);
  camera.scale=camera.fit;
  camera.x=(w-world[0]*camera.scale)/2;
  camera.y=(h-world[1]*camera.scale)/2;
  applyCamera();
}
function zoom(factor,x=figure.clientWidth/2,y=figure.clientHeight/2) {
  const next=Math.max(camera.fit*.72,Math.min(Math.max(camera.fit*5,1.8),camera.scale*factor));
  const ratio=next/camera.scale;
  camera.x=x-(x-camera.x)*ratio;
  camera.y=y-(y-camera.y)*ratio;
  camera.scale=next;
  applyCamera();
}
function fullName(key) {
  const node=nodes.get(key);
  return node.pc ? node.pc+" / "+node.name : node.name;
}
function buttonFor(key) {
  const button=document.createElement("button");
  const node=nodes.get(key);
  button.type="button";
  button.textContent=node.pc && (view==="all"||view!==node.pc)?fullName(key):node.name;
  button.addEventListener("click",()=>{inspect(key);element.focus();});
  return button;
}
function listInto(list,keys) {
  list.replaceChildren();
  for(const key of keys) {
    const li=document.createElement("li");
    li.append(buttonFor(key));
    list.append(li);
  }
  if(!keys.length) {
    const li=document.createElement("li");
    li.className="empty";li.textContent="Связей нет";list.append(li);
  }
}
function inspect(key) {
  selected=nodes.get(key)?.key??null;
  element.value=[...element.options].some((option)=>option.value===selected)?selected:"";
  get("overview").hidden=Boolean(selected);
  get("detail").hidden=!selected;
  if(!selected) {
    get("status").textContent=view==="all"
      ?"4 ПК · "+nodes.size+" вершина · "+data.edges.length+" направленных связей"
      :view+" · "+groupLocal.get(view).length+" сущностей";
    fit();
    return;
  }
  const node=nodes.get(selected);
  get("detail-title").textContent=fullName(selected);
  get("status").textContent="ID "+node.id+" · Входящих "+node.inputs.length+" · Исходящих "+node.outputs.length;
  get("lanes").hidden=selected===admin;
  get("access").hidden=selected!==admin;
  if(selected===admin) {
    const access=get("access");access.replaceChildren();
    for(const pc of [...data.pcs,null]) {
      const destinations=node.outputs.filter((id)=>nodes.get(id).pc===pc);
      const block=document.createElement("details");
      block.open=pc===null||pc===view;
      const summary=document.createElement("summary");
      summary.textContent=(pc??"Общие ресурсы")+" · "+destinations.length;
      const list=document.createElement("ul");
      listInto(list,destinations);
      block.append(summary,list);
      access.append(block);
    }
  } else {
    const compare=(a,b)=>sorter.compare(fullName(a),fullName(b));
    listInto(get("inputs"),[...node.inputs].sort(compare));
    listInto(get("outputs"),[...node.outputs].sort(compare));
  }
}
function changeView(next) {
  view=next;
  get("overview").hidden=false;
  get("detail").hidden=true;
  for(const tab of get("tabs").querySelectorAll("button")) tab.setAttribute("aria-pressed",String(tab.dataset.view===view));
  element.replaceChildren(new Option("Общий вид",""));
  for(const pc of view==="all"?[null,...data.pcs]:[null,view]) {
    const group=document.createElement("optgroup");
    group.label=pc??"Общие сущности";
    const matches=data.nodes.filter((node)=>node.pc===pc).sort((a,b)=>sorter.compare(a.name,b.name));
    for(const node of matches) group.append(new Option(node.name,node.key));
    element.append(group);
  }
  draw();
  inspect(null);
}
for(const name of ["all",...data.pcs]) {
  const tab=document.createElement("button");
  tab.type="button";tab.dataset.view=name;tab.textContent=name==="all"?"Все ПК":name;
  tab.addEventListener("click",()=>changeView(name));get("tabs").append(tab);
}
element.addEventListener("change",()=>inspect(element.value));
get("back").addEventListener("click",()=>{inspect(null);element.focus();});
get("fit").addEventListener("click",fit);
get("less").addEventListener("click",()=>zoom(.8));
get("more").addEventListener("click",()=>zoom(1.25));
canvas.addEventListener("wheel",(event)=>{
  event.preventDefault();const r=figure.getBoundingClientRect();
  zoom(event.deltaY>0?.8:1.25,event.clientX-r.left,event.clientY-r.top);
},{passive:false});
canvas.addEventListener("keydown",(event)=>{
  if(event.key==="+"||event.key==="=")zoom(1.25);
  else if(event.key==="-")zoom(.8);
  else if(event.key==="0")fit();
  else {
    const offsets = {ArrowLeft:[44,0],ArrowRight:[-44,0],ArrowUp:[0,44],ArrowDown:[0,-44]};
    if(!Object.hasOwn(offsets,event.key))return;
    const [x,y]=offsets[event.key];
    camera.x+=x;camera.y+=y;applyCamera();
  }
  event.preventDefault();
});
canvas.addEventListener("pointerdown",(event)=>{
  if(event.target.closest(".zoom")||event.button!==0||!event.isPrimary)return;
  moved=false;drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:camera.x,top:camera.y,moving:false};
});
canvas.addEventListener("pointermove",(event)=>{
  if(drag?.id!==event.pointerId)return;
  const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
  if(!drag.moving&&Math.hypot(dx,dy)<5)return;
  if(!drag.moving){canvas.setPointerCapture(event.pointerId);drag.moving=true;canvas.classList.add("dragging");highlight(null);}
  camera.x=drag.left+dx;camera.y=drag.top+dy;applyCamera();
});
function endDrag(event) {
  if(drag?.id!==event.pointerId)return;
  moved=drag.moving;drag=null;canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup",endDrag);
canvas.addEventListener("pointercancel",endDrag);
canvas.addEventListener("lostpointercapture",endDrag);
canvas.addEventListener("pointerleave",(event)=>{if(!drag?.moving)endDrag(event);});
new ResizeObserver(()=>{if(!get("overview").hidden)fit();}).observe(canvas);
changeView("all");
</script>
</body>
</html>
